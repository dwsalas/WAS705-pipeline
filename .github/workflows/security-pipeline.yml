name: Security Pipeline
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tests/**'
      - '.github/workflows/security-pipeline.yml'
jobs:
  static-analysis:
    runs-on: [self-hosted, on-prem]
    outputs:
      summary: ${{ steps.semgrep_summary.outputs.summary }}
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
      - name: Clone Firefly III source (v6.6.2) if not already present
        run: |
          if [ -d /home/kali/firefly-iii-src-cache/.git ]; then
            echo "Cached source found, skipping clone."
          else
            echo "Cloning fresh into cache..."
            git clone --branch v6.6.2 --depth 1 https://github.com/firefly-iii/firefly-iii.git /home/kali/firefly-iii-src-cache
          fi
      - name: Run Semgrep
        run: |
          mkdir -p /home/kali/pipeline-results
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          /home/kali/.local/bin/semgrep scan --config auto /home/kali/firefly-iii-src-cache --json --output /home/kali/pipeline-results/semgrep-results-${TIMESTAMP}.json
          cp /home/kali/pipeline-results/semgrep-results-${TIMESTAMP}.json /home/kali/pipeline-results/semgrep-results-latest.json
      - name: Summarize Semgrep results
        id: semgrep_summary
        run: |
          SUMMARY=$(python3 -c "
          import json
          from collections import Counter
          d = json.load(open('/home/kali/pipeline-results/semgrep-results-latest.json'))
          results = d['results']
          total = len(results)
          counts = Counter(r['extra']['severity'] for r in results)
          breakdown = ', '.join(f'{v} {k}' for k, v in counts.most_common())
          print(f'{total} findings ({breakdown})')
          ")
          echo "summary=**Static Analysis (Semgrep):** ${SUMMARY}" >> "$GITHUB_OUTPUT"
  dependency-scan:
    needs: static-analysis
    runs-on: [self-hosted, on-prem]
    outputs:
      summary: ${{ steps.composer_summary.outputs.summary }}
    steps:
      - name: Run composer audit
        run: |
          cd /home/kali/firefly-iii-src-cache
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          composer install --no-interaction --no-scripts --ignore-platform-reqs || true
          composer audit --format=json > /home/kali/pipeline-results/composer-audit-${TIMESTAMP}.json || true
          cp /home/kali/pipeline-results/composer-audit-${TIMESTAMP}.json /home/kali/pipeline-results/composer-audit-latest.json
      - name: Summarize composer audit results
        id: composer_summary
        run: |
          SUMMARY=$(python3 -c "
          import json
          d = json.load(open('/home/kali/pipeline-results/composer-audit-latest.json'))
          advisories = d.get('advisories', {})
          total = sum(len(v) for v in advisories.values())
          critical = sum(1 for v in advisories.values() for a in v if a.get('severity') == 'critical')
          high = sum(1 for v in advisories.values() for a in v if a.get('severity') == 'high')
          print(f'{total} advisories across {len(advisories)} packages ({critical} critical, {high} high)')
          ")
          echo "summary=**Dependency Scan (composer audit):** ${SUMMARY}" >> "$GITHUB_OUTPUT"
  security-tests:
    needs: dependency-scan
    runs-on: [self-hosted, on-prem]
    outputs:
      csv: ${{ steps.csv_test.outputs.result }}
      login: ${{ steps.login_test.outputs.result }}
      install: ${{ steps.install_test.outputs.result }}
      idor: ${{ steps.idor_test.outputs.result }}
      docker_env: ${{ steps.docker_env_test.outputs.result }}
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install requests --break-system-packages
      - name: Run CSV injection test (INPV-21)
        id: csv_test
        env:
          FIREFLY_BASE_URL: http://172.16.24.73
          FIREFLY_API_TOKEN: ${{ secrets.FIREFLY_API_TOKEN_DWSALAS }}
        run: |
          set +e
          python3 tests/test_csv_injection.py > /tmp/test_output.txt 2>&1
          TEST_EXIT=$?
          set -e
          cat /tmp/test_output.txt
          RESULT_LINE=$(grep 'RESULT:' /tmp/test_output.txt | tail -1)
          echo "result=**CSV Injection (INPV-21):** ${RESULT_LINE}" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
      - name: Run login throttling test
        id: login_test
        if: always()
        env:
          FIREFLY_BASE_URL: http://172.16.24.73
        run: |
          set +e
          python3 tests/test_login_throttle.py > /tmp/test_output.txt 2>&1
          TEST_EXIT=$?
          set -e
          cat /tmp/test_output.txt
          RESULT_LINE=$(grep 'RESULT:' /tmp/test_output.txt | tail -1)
          echo "result=**Login Throttling:** ${RESULT_LINE}" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
      - name: Run install endpoint auth test (V-01)
        id: install_test
        if: always()
        env:
          FIREFLY_BASE_URL: http://172.16.24.73
        run: |
          set +e
          python3 tests/test_install_endpoint.py > /tmp/test_output.txt 2>&1
          TEST_EXIT=$?
          set -e
          cat /tmp/test_output.txt
          RESULT_LINE=$(grep 'RESULT:' /tmp/test_output.txt | tail -1)
          echo "result=**Install Endpoint Auth (V-01):** ${RESULT_LINE}" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
      - name: Run cross-user IDOR test
        id: idor_test
        if: always()
        env:
          FIREFLY_BASE_URL: http://172.16.24.73
          FIREFLY_API_TOKEN_USER1: ${{ secrets.FIREFLY_API_TOKEN_DWSALAS }}
          FIREFLY_API_TOKEN_USER2: ${{ secrets.FIREFLY_API_TOKEN_DWSALAS_USER2 }}
        run: |
          set +e
          python3 tests/test_idor_cross_user.py > /tmp/test_output.txt 2>&1
          TEST_EXIT=$?
          set -e
          cat /tmp/test_output.txt
          RESULT_LINE=$(grep 'OVERALL RESULT:' /tmp/test_output.txt | tail -1)
          echo "result=**Cross-User IDOR:** ${RESULT_LINE}" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
      - name: Run Docker env-file permissions and secret exposure test
        id: docker_env_test
        if: always()
        env:
          FIREFLY_SSH_HOST: 172.16.24.73
          FIREFLY_SSH_USER: allan
          FIREFLY_SSH_KEY: /home/kali/.ssh/pipeline_key
        run: |
          set +e
          python3 tests/test_env_permissions.py > /tmp/test_output.txt 2>&1
          TEST_EXIT=$?
          set -e
          cat /tmp/test_output.txt
          RESULT_LINE=$(grep 'OVERALL RESULT:' /tmp/test_output.txt | tail -1)
          echo "result=**Docker Env/Secrets:** ${RESULT_LINE}" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
  notify:
    needs: [static-analysis, dependency-scan, security-tests]
    if: failure()
    runs-on: [self-hosted, on-prem]
    steps:
      - name: Notify via Discord with findings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_DWSALAS }}
          SEMGREP_SUMMARY: ${{ needs.static-analysis.outputs.summary }}
          COMPOSER_SUMMARY: ${{ needs.dependency-scan.outputs.summary }}
          CSV_RESULT: ${{ needs.security-tests.outputs.csv }}
          LOGIN_RESULT: ${{ needs.security-tests.outputs.login }}
          INSTALL_RESULT: ${{ needs.security-tests.outputs.install }}
          IDOR_RESULT: ${{ needs.security-tests.outputs.idor }}
          DOCKER_ENV_RESULT: ${{ needs.security-tests.outputs.docker_env }}
        run: |
          PAYLOAD=$(python3 -c "
          import json, os
          lines = [
              os.environ.get('SEMGREP_SUMMARY', ''),
              os.environ.get('COMPOSER_SUMMARY', ''),
              os.environ.get('CSV_RESULT', ''),
              os.environ.get('LOGIN_RESULT', ''),
              os.environ.get('INSTALL_RESULT', ''),
              os.environ.get('IDOR_RESULT', ''),
              os.environ.get('DOCKER_ENV_RESULT', ''),
          ]
          summary = chr(10).join(l for l in lines if l)
          content = f'''🚨 **Security Pipeline Alert** 🚨
          Repo: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Findings:**
          {summary}'''
          print(json.dumps({'content': content}))
          ")
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
      - name: Notify via Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🚨 Security Pipeline Alert - WAS705-FINAL"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: WAS705 Security Pipeline
          body: |
            Security Pipeline Alert
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Findings:
            ${{ needs.static-analysis.outputs.summary }}
            ${{ needs.dependency-scan.outputs.summary }}
            ${{ needs.security-tests.outputs.csv }}
            ${{ needs.security-tests.outputs.login }}
            ${{ needs.security-tests.outputs.install }}
            ${{ needs.security-tests.outputs.idor }}
            ${{ needs.security-tests.outputs.docker_env }}
