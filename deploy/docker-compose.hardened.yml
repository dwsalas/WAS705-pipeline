# =====================================================================
# WAS705 Part II - Hardened, automated Firefly III v6.6.2 deployment.
# Stack: app (Firefly) + db (MariaDB) + cron + nginx (TLS reverse proxy).
# The app is NOT published directly; only nginx exposes 80/443.
# TLS cert is generated on the host by deploy.sh and bind-mounted in.
# =====================================================================
services:
  app:
    image: fireflyiii/core:version-6.6.2
    restart: unless-stopped
    env_file: .env
    volumes:
      - firefly_upload:/var/www/html/storage/upload
      # INPV-21 persistent fix: patched exporter bind-mounted over the stock file.
      - ./patch/ExportDataGenerator.php:/var/www/html/app/Support/Export/ExportDataGenerator.php:ro
    expose:
      - "8080"
    depends_on:
      - db

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: firefly
    volumes:
      - firefly_db:/var/lib/mysql

  cron:
    image: alpine:3.20
    restart: unless-stopped
    command: >
      sh -c "echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/${CRON_TOKEN}\" > /etc/crontabs/root && crond -f -l 8"
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/firefly.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  firefly_upload:
  firefly_db: